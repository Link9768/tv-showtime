<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon TV Showtime</title>
<style>
  :root{
    --bg:#14161f; --panel:#1c1f2b; --card:#232736; --line:#2e3345;
    --text:#eef0f6; --muted:#8b90a3; --accent:#ffd233; --accent-ink:#191300;
    --soon:#ff5c5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .logo{font-weight:800;font-size:19px}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:6px}
  nav button{padding:8px 16px;border-radius:20px;border:0;background:none;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer}
  nav button.on{background:var(--accent);color:var(--accent-ink)}
  .searchbox{margin-left:auto;position:relative}
  .searchbox input{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 16px;color:var(--text);width:280px;font-size:14px;outline:none}
  .searchbox input:focus{border-color:var(--accent)}
  .results{position:absolute;top:44px;right:0;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:420px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .results:empty{display:none}
  .res{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
  .res:hover{background:var(--card)}
  .res img,.res .noimg{width:38px;height:54px;border-radius:5px;object-fit:cover;background:var(--card);flex:none}
  .res .n{font-weight:600}
  .res .y{color:var(--muted);font-size:13px}
  .res .added{margin-left:auto;color:var(--accent);font-size:12px;font-weight:700}
  main{max-width:1080px;margin:0 auto;padding:28px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 16px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .warn{background:#3a2626;border:1px solid #5e3535;color:#ffb3b3;padding:10px 16px;border-radius:10px;margin-bottom:20px}
  /* grille */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .poster{border-radius:10px;overflow:hidden;background:var(--card);position:relative}
  .poster img,.poster .noimg{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:linear-gradient(160deg,#3d2f6e,#1c4a6e)}
  .poster .noimg{display:flex;align-items:center;justify-content:center;font-weight:700;padding:12px;text-align:center;color:#fff}
  .poster .t{padding:10px 12px;font-weight:600;font-size:13.5px}
  .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;padding:3px 9px;border-radius:12px}
  .del{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1;display:none}
  .poster:hover .del{display:block}
  /* à venir */
  .up{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
  .thumb{width:44px;height:62px;border-radius:6px;flex:none;object-fit:cover;background:var(--panel)}
  .info{flex:1;min-width:0}
  .info .show{font-weight:700}
  .info .ep{color:var(--muted);font-size:13.5px}
  .count{text-align:right;flex:none;min-width:110px}
  .count b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .count.today b{color:var(--accent)} .count.week b{color:var(--soon)}
  .count small{color:var(--muted)}
  .datehdr{color:var(--muted);font-size:13px;font-weight:700;margin:14px 0 2px;text-transform:uppercase;letter-spacing:1px}
  /* modal saisons */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 28px;width:min(440px,92vw);max-height:80vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-size:19px}
  .modal .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .season{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
  .season:last-child{border-bottom:0}
  .circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;flex:none;color:var(--accent-ink);font-weight:800;font-size:14px;line-height:1}
  .circle.on{background:var(--accent);border-color:var(--accent)}
  .season .sn{font-weight:700;flex:1}
  .season .se{color:var(--muted);font-size:13px}
  .close{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .poster{cursor:pointer}
  /* stats */
  .statbig{font-size:42px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .statsub{color:var(--muted);margin-bottom:28px}
  .statrow{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:10px}
  .statrow .n{flex:1;font-weight:600}
  .statrow .v{font-variant-numeric:tabular-nums;color:var(--muted)}
  .statrow .h{font-weight:800;font-variant-numeric:tabular-nums;min-width:80px;text-align:right}
  /* où regarder */
  .wherebox{max-width:560px;margin:0 auto 24px}
  .wherebox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 18px;color:var(--text);font-size:15px;outline:none}
  .wherebox input:focus{border-color:var(--accent)}
  .where-results{max-width:560px;margin:0 auto}
  .where-res{display:flex;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
  .where-res:hover{border-color:var(--accent)}
  .where-res img,.where-res .noimg{width:44px;height:62px;border-radius:5px;object-fit:cover;background:var(--panel);flex:none}
  .where-res .n{font-weight:700}
  .where-res .y{color:var(--muted);font-size:13px}
  .providers{max-width:760px;margin:0 auto}
  .prov-head{display:flex;gap:16px;align-items:center;margin-bottom:24px}
  .prov-head img,.prov-head .noimg{width:80px;height:114px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}
  .prov-head h3{font-size:22px;margin:0 0 4px}
  .prov-head a{color:var(--accent);font-size:13px;text-decoration:none}
  .prov-group{margin-bottom:20px}
  .prov-group h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px}
  .prov-list{display:flex;flex-wrap:wrap;gap:10px}
  .prov-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-decoration:none;color:var(--text);font-size:13.5px;font-weight:600}
  .prov-item:hover{border-color:var(--accent)}
  .prov-item img{width:24px;height:24px;border-radius:5px}
  .prov-back{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 16px;cursor:pointer;font-size:13px;margin-bottom:18px}
</style>
</head>
<body>
<header>
  <div class="logo">Mon TV <span>Showtime</span></div>
  <nav>
    <button id="tabShows">Mes séries</button>
    <button id="tabMovies">Films</button>
    <button id="tabUp">À venir</button>
    <button id="tabWhere">Où regarder</button>
    <button id="tabStat">Stat</button>
  </nav>
  <div class="searchbox">
    <input id="q" type="search" placeholder="🔍 Ajouter une série…" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <button id="exportBtn" title="Exporter mes données (sauvegarde)" style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:13px">⬇ Export</button>
  <button id="importBtn" title="Importer une sauvegarde" style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:13px">⬆ Import</button>
  <input id="importFile" type="file" accept="application/json" style="display:none">
</header>
<main id="main"></main>
<script>
const API = 'https://api.tvmaze.com';
const JW_API = 'https://n8n.srv1250642.hstgr.cloud/webhook/justwatch';
const $ = s => document.querySelector(s);
let shows = JSON.parse(localStorage.getItem('shows') || '[]');
let epCache = JSON.parse(localStorage.getItem('epCache') || '{}'); // id -> {next, seasons:{num:{eps,minutes}}, fetched:ts}
let watched = JSON.parse(localStorage.getItem('watched') || '{}'); // id -> [seasonNums]
let movies = JSON.parse(localStorage.getItem('movies') || '[]'); // {id,title,year,poster,justwatchUrl,seen}
let tab = 'up';
let apiDown = false;

function save(){
  localStorage.setItem('shows', JSON.stringify(shows));
  localStorage.setItem('epCache', JSON.stringify(epCache));
  localStorage.setItem('watched', JSON.stringify(watched));
  localStorage.setItem('movies', JSON.stringify(movies));
}
async function jwSearch(query) {
  const r = await fetch(JW_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
  const data = await r.json();
  return data.results || [];
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- recherche ---- */
let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (!q) { $('#results').innerHTML = ''; return; }
  timer = setTimeout(async () => {
    try {
      const r = await fetch(`${API}/search/shows?q=${encodeURIComponent(q)}`);
      const data = await r.json();
      $('#results').innerHTML = data.slice(0, 8).map(x => {
        const s = x.show, has = shows.some(w => w.id === s.id);
        const img = s.image ? `<img src="${s.image.medium}" alt="">` : `<div class="noimg"></div>`;
        return `<div class="res" data-id="${s.id}" data-name="${esc(s.name)}" data-img="${s.image ? s.image.medium : ''}">
          ${img}<div><div class="n">${esc(s.name)}</div><div class="y">${s.premiered ? s.premiered.slice(0,4) : '?'} · ${esc(s.network?.name || s.webChannel?.name || '')}</div></div>
          ${has ? '<div class="added">✓ ajoutée</div>' : ''}</div>`;
      }).join('') || '<div class="res">Aucun résultat</div>';
    } catch { $('#results').innerHTML = '<div class="res">Erreur API TVMaze</div>'; }
  }, 350);
});
$('#results').addEventListener('click', e => {
  const el = e.target.closest('.res[data-id]');
  if (!el) return;
  const id = +el.dataset.id;
  if (!shows.some(w => w.id === id)) {
    shows.push({ id, name: el.dataset.name, image: el.dataset.img });
    applyHistory(id, el.dataset.name);
    delete epCache[id];
    save();
    refreshEpisodes([id]).then(render);
  }
  $('#q').value = ''; $('#results').innerHTML = '';
  render();
});
document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) $('#results').innerHTML = ''; });

/* ---- épisodes ---- */
async function refreshEpisodes(ids) {
  apiDown = false;
  const today = new Date(); today.setHours(0,0,0,0);
  await Promise.all(ids.map(async id => {
    try {
      const r = await fetch(`${API}/shows/${id}/episodes?specials=1`);
      const eps = await r.json();
      const next = eps.find(ep => ep.airdate && new Date(ep.airdate + 'T00:00:00') >= today) || null;
      // durée moyenne du show en fallback pour les épisodes sans runtime
      const known = eps.filter(e => e.runtime);
      const avg = known.length ? Math.round(known.reduce((a,e) => a + e.runtime, 0) / known.length) : 40;
      const seasons = {};
      for (const ep of eps.filter(e => e.type === 'regular')) {
        if (!seasons[ep.season]) seasons[ep.season] = { eps: 0, minutes: 0 };
        seasons[ep.season].eps++;
        seasons[ep.season].minutes += ep.runtime || avg;
      }
      epCache[id] = { next: next && { airdate: next.airdate, season: next.season, number: next.number, name: next.name }, seasons, fetched: Date.now() };
    } catch { apiDown = true; }
  }));
  save();
}

function daysUntil(airdate) {
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(airdate + 'T00:00:00') - today) / 86400000);
}
function countLabel(d) {
  if (d === 0) return "Aujourd'hui";
  if (d === 1) return 'Demain';
  if (d < 60) return d + ' j';
  if (d < 365) return Math.round(d / 30.44) + ' mois';
  const y = Math.floor(d / 365);
  return y + ' an' + (y > 1 ? 's' : '');
}
function fmtDate(airdate) {
  return new Date(airdate + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}
function epCode(ep) { return 'S' + String(ep.season).padStart(2,'0') + 'E' + String(ep.number).padStart(2,'0'); }

/* ---- modal saisons ---- */
function openShow(id) {
  const s = shows.find(x => x.id === id);
  const c = epCache[id];
  if (!c || !c.seasons) { refreshEpisodes([id]).then(() => openShow(id)); return; }
  const w = watched[id] || [];
  const nums = Object.keys(c.seasons).map(Number).sort((a,b) => a - b);
  const div = document.createElement('div');
  div.className = 'overlay';
  div.innerHTML = `<div class="modal"><button class="close">✕</button><h3>${esc(s.name)}</h3>
    <div class="sub">Coche une saison = toute la saison vue</div>` +
    nums.map(n => {
      const sn = c.seasons[n];
      return `<div class="season"><button class="circle ${w.includes(n) ? 'on' : ''}" data-s="${n}">${w.includes(n) ? '✓' : ''}</button>
        <div class="sn">Saison ${n}</div><div class="se">${sn.eps} ép. · ${Math.round(sn.minutes/60)} h</div></div>`;
    }).join('') + '</div>';
  div.addEventListener('click', e => {
    if (e.target === div || e.target.closest('.close')) { div.remove(); render(); return; }
    const btn = e.target.closest('.circle');
    if (!btn) return;
    const n = +btn.dataset.s;
    let list = watched[id] || [];
    list = list.includes(n) ? list.filter(x => x !== n) : [...list, n];
    watched[id] = list; save();
    btn.classList.toggle('on'); btn.textContent = btn.classList.contains('on') ? '✓' : '';
  });
  document.body.appendChild(div);
}

/* ---- rendu ---- */
function render() {
  $('#tabShows').className = tab === 'shows' ? 'on' : '';
  $('#tabMovies').className = tab === 'movies' ? 'on' : '';
  $('#tabUp').className = tab === 'up' ? 'on' : '';
  $('#tabWhere').className = tab === 'where' ? 'on' : '';
  $('#tabStat').className = tab === 'stat' ? 'on' : '';
  if (tab === 'stat') { renderStats(); return; }
  if (tab === 'movies') { renderMovies(); return; }
  if (tab === 'where') { renderWhere(); return; }
  const m = $('#main');
  const warn = apiDown ? '<div class="warn">API TVMaze inaccessible — affichage des dernières données connues.</div>' : '';
  if (!shows.length) { m.innerHTML = warn + '<div class="empty">Aucune série. Utilise la recherche en haut à droite pour en ajouter.</div>'; return; }

  if (tab === 'shows') {
    const sorted = [...shows].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    m.innerHTML = warn + '<h2>Mes séries</h2><input id="filter" type="search" placeholder="🔎 Filtrer mes séries…" style="width:100%;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 16px;color:var(--text);font-size:14px;outline:none"><div class="grid">' + sorted.map(s => {
      const next = epCache[s.id]?.next;
      const d = next ? daysUntil(next.airdate) : null;
      const badge = d !== null && d >= 0 ? `<div class="badge">${countLabel(d)}</div>` : '';
      const img = s.image ? `<img src="${s.image}" alt="">` : `<div class="noimg">${esc(s.name)}</div>`;
      return `<div class="poster" data-id="${s.id}" data-name="${esc(s.name.toLowerCase())}">${img}<div class="t">${esc(s.name)}</div>${badge}<button class="del" data-id="${s.id}" title="Retirer">✕</button></div>`;
    }).join('') + '</div>';
    m.querySelector('#filter').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      m.querySelectorAll('.poster').forEach(p => p.style.display = p.dataset.name.includes(q) ? '' : 'none');
    });
  } else {
    const items = shows.map(s => ({ s, next: epCache[s.id]?.next }))
      .filter(x => x.next).map(x => ({ ...x, d: daysUntil(x.next.airdate) }))
      .filter(x => x.d >= 0).sort((a,b) => a.d - b.d);
    const groups = [
      ["Aujourd'hui", items.filter(x => x.d === 0), 'today'],
      ['Cette semaine', items.filter(x => x.d > 0 && x.d <= 7), 'week'],
      ['Ce mois-ci', items.filter(x => x.d > 7 && x.d <= 30), ''],
      ['Plus tard', items.filter(x => x.d > 30), ''],
    ];
    let html = warn + '<h2>Prochains épisodes</h2><div class="up">';
    let any = false;
    for (const [label, list, cls] of groups) {
      if (!list.length) continue;
      any = true;
      html += `<div class="datehdr">${label}</div>` + list.map(x => `
        <div class="row">
          ${x.s.image ? `<img class="thumb" src="${x.s.image}" alt="">` : '<div class="thumb"></div>'}
          <div class="info"><div class="show">${esc(x.s.name)}</div><div class="ep">${epCode(x.next)}${x.next.name ? ' — « ' + esc(x.next.name) + ' »' : ''}</div></div>
          <div class="count ${cls}"><b>${x.d === 0 ? 'Ce soir' : countLabel(x.d)}</b><small>${fmtDate(x.next.airdate)}</small></div>
        </div>`).join('');
    }
    if (!any) html += '<div class="empty">Rien à venir.</div>';
    m.innerHTML = html + '</div>';
  }
}
/* ---- stats ---- */
function renderStats() {
  const rows = shows.map(s => {
    const c = epCache[s.id];
    const w = watched[s.id] || [];
    let eps = 0, min = 0;
    if (c?.seasons) for (const n of w) { const sn = c.seasons[n]; if (sn) { eps += sn.eps; min += sn.minutes; } }
    return { s, seasons: w.length, eps, min };
  }).filter(r => r.min > 0).sort((a,b) => b.min - a.min);
  const total = rows.reduce((a,r) => a + r.min, 0);
  const d = Math.floor(total / 1440), h = Math.floor(total % 1440 / 60), mn = total % 60;
  const mo = Math.floor(d / 30.44);
  const big = total ? (mo ? `${mo} mois ${Math.round(d - mo * 30.44)} j` : d ? `${d} j ${h} h` : `${h} h ${mn} min`) : '0 h';
  $('#main').innerHTML = `<h2>Statistique et temps passé devant des séries</h2>
    <div class="statbig">${big}</div>
    <div class="statsub">${mo ? `soit ${d} j ${h} h · ` : ''}${rows.reduce((a,r) => a + r.eps, 0)} épisodes · ${rows.reduce((a,r) => a + r.seasons, 0)} saisons cochées</div>` +
    (rows.length ? rows.map(r => `<div class="statrow">
      ${r.s.image ? `<img class="thumb" src="${r.s.image}" alt="">` : '<div class="thumb"></div>'}
      <div class="n">${esc(r.s.name)}</div>
      <div class="v">${r.seasons} saison${r.seasons > 1 ? 's' : ''} · ${r.eps} ép.</div>
      <div class="h">${Math.round(r.min/60)} h</div></div>`).join('')
    : '<div class="empty">Coche des saisons (clic sur une série) pour alimenter les stats.</div>');
}

/* ---- films ---- */
function renderMovies() {
  const m = $('#main');
  let html = `<h2>Mes films</h2>
    <div class="wherebox"><input id="movieSearch" type="search" placeholder="🔍 Chercher un film à ajouter…" autocomplete="off"></div>
    <div class="where-results" id="movieResults"></div>`;
  if (!movies.length) {
    html += '<div class="empty">Aucun film. Utilise la recherche ci-dessus pour en ajouter.</div>';
  } else {
    const sorted = [...movies].sort((a, b) => a.title.localeCompare(b.title, 'fr'));
    html += '<div class="grid">' + sorted.map(mv => {
      const badge = mv.seen ? '<div class="badge">✓ vu</div>' : '';
      const img = mv.poster ? `<img src="${esc(mv.poster)}" alt="">` : `<div class="noimg">${esc(mv.title)}</div>`;
      return `<div class="poster" data-movie="${mv.id}">${img}<div class="t" data-movie-seen="${mv.id}" title="Cliquer pour marquer vu/non vu">${esc(mv.title)}${mv.year ? ' (' + mv.year + ')' : ''}</div>${badge}<button class="del" data-movie-del="${mv.id}" title="Retirer">✕</button></div>`;
    }).join('') + '</div>';
  }
  m.innerHTML = html;

  let timer;
  $('#movieSearch').addEventListener('input', e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (!q) { $('#movieResults').innerHTML = ''; return; }
    timer = setTimeout(async () => {
      $('#movieResults').innerHTML = '<div class="empty">Recherche…</div>';
      try {
        const results = await jwSearch(q);
        const films = results.filter(r => r.type === 'MOVIE');
        $('#movieResults').innerHTML = films.length ? films.map(f => {
          const has = movies.some(x => x.id === f.id);
          const img = f.poster ? `<img src="${esc(f.poster)}" alt="">` : '<div class="noimg"></div>';
          return `<div class="where-res" data-add="${f.id}" data-title="${esc(f.title)}" data-year="${f.year || ''}" data-poster="${esc(f.poster)}" data-jw="${esc(f.justwatchUrl)}">
            ${img}<div><div class="n">${esc(f.title)}</div><div class="y">${f.year || '?'}</div></div>
            ${has ? '<div class="added" style="margin-left:auto;color:var(--accent);font-size:12px;font-weight:700">✓ ajouté</div>' : ''}</div>`;
        }).join('') : '<div class="empty">Aucun film trouvé.</div>';
      } catch { $('#movieResults').innerHTML = '<div class="empty">Erreur de recherche.</div>'; }
    }, 400);
  });
  $('#movieResults').addEventListener('click', e => {
    const el = e.target.closest('.where-res[data-add]');
    if (!el) return;
    const id = el.dataset.add;
    if (!movies.some(x => x.id === id)) {
      movies.push({ id, title: el.dataset.title, year: el.dataset.year ? +el.dataset.year : null, poster: el.dataset.poster, justwatchUrl: el.dataset.jw, seen: false });
      save();
    }
    $('#movieSearch').value = ''; $('#movieResults').innerHTML = '';
    renderMovies();
  });
  m.querySelectorAll('.poster[data-movie]').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target.closest('.del') || e.target.closest('[data-movie-seen]')) return;
      const mv = movies.find(x => x.id === p.dataset.movie);
      if (mv) openProvidersForTitle(mv.title);
    });
  });
  m.querySelectorAll('[data-movie-seen]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const mv = movies.find(x => x.id === el.dataset.movieSeen);
      if (mv) { mv.seen = !mv.seen; save(); renderMovies(); }
    });
  });
  m.querySelectorAll('[data-movie-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      movies = movies.filter(x => x.id !== btn.dataset.movieDel);
      save(); renderMovies();
    });
  });
}

/* ---- où regarder ---- */
function renderWhere() {
  const m = $('#main');
  m.innerHTML = `<h2>Où regarder</h2>
    <div class="wherebox"><input id="whereSearch" type="search" placeholder="🔍 Chercher un film ou une série…" autocomplete="off"></div>
    <div class="where-results" id="whereResults"></div>`;
  let timer;
  $('#whereSearch').addEventListener('input', e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (!q) { $('#whereResults').innerHTML = ''; return; }
    timer = setTimeout(async () => {
      $('#whereResults').innerHTML = '<div class="empty">Recherche…</div>';
      try {
        const results = await jwSearch(q);
        $('#whereResults').innerHTML = results.length ? results.map(r => {
          const img = r.poster ? `<img src="${esc(r.poster)}" alt="">` : '<div class="noimg"></div>';
          return `<div class="where-res" data-title="${esc(r.title)}">
            ${img}<div><div class="n">${esc(r.title)}</div><div class="y">${r.year || '?'} · ${r.type === 'MOVIE' ? 'Film' : 'Série'}</div></div></div>`;
        }).join('') : '<div class="empty">Aucun résultat.</div>';
      } catch { $('#whereResults').innerHTML = '<div class="empty">Erreur de recherche.</div>'; }
    }, 400);
  });
  $('#whereResults').addEventListener('click', e => {
    const el = e.target.closest('.where-res[data-title]');
    if (el) openProvidersForTitle(el.dataset.title);
  });
}

async function openProvidersForTitle(title) {
  const m = $('#main');
  m.innerHTML = '<button class="prov-back" id="provBack">← Retour</button><div class="empty">Chargement…</div>';
  $('#provBack').onclick = () => render();
  try {
    const results = await jwSearch(title);
    const hit = results.find(r => r.title.toLowerCase() === title.toLowerCase()) || results[0];
    if (!hit) { $('#main').innerHTML += '<div class="empty">Aucune information disponible.</div>'; return; }
    renderProviders(hit);
  } catch { $('#main').innerHTML = '<button class="prov-back" id="provBack">← Retour</button><div class="empty">Erreur de recherche.</div>'; $('#provBack').onclick = () => render(); }
}

function renderProviders(hit) {
  const labels = { FREE: 'Gratuit', FLATRATE: 'Abonnement', RENT: 'Location', BUY: 'Achat' };
  const img = hit.poster ? `<img src="${esc(hit.poster)}" alt="">` : '<div class="noimg"></div>';
  let html = `<button class="prov-back" id="provBack">← Retour</button>
    <div class="providers">
      <div class="prov-head">${img}<div><h3>${esc(hit.title)}${hit.year ? ' (' + hit.year + ')' : ''}</h3>
      ${hit.justwatchUrl ? `<a href="${esc(hit.justwatchUrl)}" target="_blank" rel="noopener">Voir sur JustWatch ↗</a>` : ''}</div></div>`;
  let any = false;
  for (const key of ['FREE', 'FLATRATE', 'RENT', 'BUY']) {
    const list = hit.offers?.[key] || [];
    if (!list.length) continue;
    any = true;
    html += `<div class="prov-group"><h4>${labels[key]}</h4><div class="prov-list">` +
      list.map(o => `<a class="prov-item" href="${esc(o.url)}" target="_blank" rel="noopener">${o.icon ? `<img src="${esc(o.icon)}" alt="">` : ''}${esc(o.name)}</a>`).join('') +
      '</div></div>';
  }
  if (!any) html += '<div class="empty">Pas d\'offre de streaming trouvée en France pour ce titre.</div>';
  $('#main').innerHTML = html + '</div>';
  $('#provBack').onclick = () => render();
}

$('#main').addEventListener('click', e => {
  const btn = e.target.closest('.del');
  if (btn) {
    const id = +btn.dataset.id;
    shows = shows.filter(s => s.id !== id);
    delete epCache[id]; delete watched[id];
    save(); render();
    return;
  }
  const p = e.target.closest('.poster[data-id]');
  if (p) openShow(+p.dataset.id);
});

$('#exportBtn').onclick = () => {

};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.shows || !data.watched) throw 0;
      shows = data.shows;
      epCache = data.epCache || {};
      watched = data.watched;
      movies = data.movies || [];
      localStorage.setItem('historyImportedV2', '1'); // sauvegarde restaurée = pas de réimport historique
      save();
      render();
      alert('Sauvegarde restaurée : ' + shows.length + ' séries, ' + movies.length + ' films.');
    } catch { alert('Fichier de sauvegarde invalide.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function applyHistory(id, name) {
  const seasons = HISTORY[name];
  if (!seasons) return;
  const existing = watched[id] || [];
  watched[id] = [...new Set([...existing, ...seasons])];
}

async function importHistory() {
  if (localStorage.getItem('historyImportedV2')) return;
  const names = Object.keys(HISTORY);
  const m = $('#main');
  const fails = [];
  for (let i = 0; i < names.length; i++) {
    const name = names[i];
    m.innerHTML = `<div class="empty">Import de l'historique TV Time… ${i + 1}/${names.length}<br><b>${esc(name)}</b></div>`;
    try {
      let show = shows.find(s => s.name === name);
      if (!show) {
        const r = await fetch(`${API}/singlesearch/shows?q=${encodeURIComponent(name)}`);
        if (!r.ok) throw 0;
        const s = await r.json();
        show = shows.find(w => w.id === s.id);
        if (!show) { show = { id: s.id, name: s.name, image: s.image ? s.image.medium : '' }; shows.push(show); }
      }
      applyHistory(show.id, name);
      if (!epCache[show.id]?.seasons) await refreshEpisodes([show.id]);
      save();
    } catch { fails.push(name); }
    // TVMaze limite à ~20 requêtes / 10 s
    await new Promise(r => setTimeout(r, 1100));
  }
  localStorage.setItem('historyImportedV2', '1');
  localStorage.setItem('historyFails', JSON.stringify(fails));
  if (fails.length) {
    m.innerHTML = `<h2>Import terminé — ${fails.length} série(s) introuvable(s) sur TVMaze</h2>
      <div class="up">${fails.map(n => `<div class="row"><div class="info"><div class="show">${esc(n)}</div><div class="ep">À ajouter manuellement via la recherche</div></div></div>`).join('')}</div>
      <div class="empty">Clique sur un onglet pour continuer.</div>`;
    return true; // écran des échecs affiché — ne pas re-render
  }
}

/* ---- init : import historique puis rafraîchit si cache > 6 h ---- */
render();
importHistory().then(failsShown => {
  if (!failsShown) render();
  const stale = shows.filter(s => !epCache[s.id] || !epCache[s.id].seasons || Date.now() - epCache[s.id].fetched > 6*3600*1000).map(s => s.id);
  if (stale.length) refreshEpisodes(stale).then(() => { if (!failsShown) render(); });
});
